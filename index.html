<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Triple B Spinner</title>
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
    <div id="app">
      <div
        class="spinner"
        role="button"
        tabindex="0"
        aria-label="Spin the reels"
      >
        <div class="reels">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
        <p class="banner" aria-live="polite"></p>
      </div>

      <p class="info"></p>
    </div>
    <script src="myscript.js"></script>
  </body>
</html>
