<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Triple B Spinner</title>
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
    <div id="app">
      <!-- A real button gives click, Enter, Space and focus for free. -->
      <button type="button" class="spinner" aria-label="Spin the reels">
        <div class="reels">
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
        <p class="banner" aria-live="polite">
          <span data-frame="0">?</span>
          <span data-frame="1">Being Bamboozled</span>
          <span data-frame="2">Bobr, Kurwa!</span>
          <span data-frame="3">Bobr!</span>
          <span data-frame="4">Brothers</span>
          <span data-frame="5">Berlin? Bratislava!</span>
          <span data-frame="6">Black Betty Bambalam</span>
          <span data-frame="7">Bamboozling</span>
          <span data-frame="8">Beautiful Bodacious Booze</span>
          <span data-frame="9">Bully Boss Business Mykull</span>
        </p>
      </button>

      <p class="info"></p>
    </div>
    <script src="myscript.js"></script>
  </body>
</html>
